
# Release pipeline: pushing a version tag builds a signed APK and creates a draft GitHub release.
# A manual run is a testing build: it uses Gradle's debug signing key if no release key is configured.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^filmcraft\.version=//p' apps/filmcraft-android/android/gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a valid version"
            exit 1
          fi
          if [ "$v" != "$listed" ]; then
            echo "::error::The tag is v$v but gradle.properties says $listed"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.FILMCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "FILMCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key configured"
            exit 1
          else
            echo "::notice::No release key: using Gradle debug signing for this test build"
          fi

      - name: Build
        working-directory: apps/filmcraft-android/android
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./gradlew assembleRelease "-Pfilmcraft.abis=arm64-v8a" "-Pfilmcraft.version=$VERSION" --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/filmcraft-android-$VERSION.apk"

      - name: Sign
        if: env.FILMCRAFT_KEYSTORE != ''
        env:
          FILMCRAFT_KEYSTORE_PASSWORD: ${{ secrets.FILMCRAFT_KEYSTORE_PASSWORD }}
          FILMCRAFT_KEY_ALIAS: ${{ secrets.FILMCRAFT_KEY_ALIAS }}
          FILMCRAFT_KEY_PASSWORD: ${{ secrets.FILMCRAFT_KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          for apk in dist/*.apk; do
            "$apksigner" sign --ks "$FILMCRAFT_KEYSTORE" --ks-key-alias "$FILMCRAFT_KEY_ALIAS" \
              --ks-pass env:FILMCRAFT_KEYSTORE_PASSWORD --key-pass env:FILMCRAFT_KEY_PASSWORD \
              --lineage .github/signing/lightcraft-to-artcraft.lineage --rotation-min-sdk-version 28 \
              --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
              --v4-signing-enabled false --alignment-preserved true "$apk"
          done

      - name: Verify APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify --verbose "$apk"
            if [ -n "$FILMCRAFT_KEYSTORE" ]; then
              certs="$("$apksigner" verify --print-certs "$apk")"
              if ! "$apksigner" lineage --in "$apk" --print-certs | grep -q "CN=LightCraft for Android"; then
                echo "::error::$apk has no required signing lineage"
                exit 1
              fi
              {
                echo "    $(basename "$apk")"
                grep "certificate SHA-256" <<<"$certs" | sed 's/^/      /'
              } >>"$GITHUB_STEP_SUMMARY"
            else
              echo "::notice::Test APK signed with temporary debug key"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  release:
    name: GitHub Release
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Draft the release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "## What's Changed" -- dist/*
          echo "Draft $GITHUB_REF_NAME is ready." >>"$GITHUB_STEP_SUMMARY"
